# VendorPay frontend — CI gate + gated deployments
#
#   feature/* --PR--> main    guard + test gate   (merge blocked by repo merge check)
#   push/merge to main        test gate -> deploy to TEST
#   main      --PR--> prod    guard + test gate   (guard proves the commit went through TEST)
#   merge     main -> prod    test gate -> deploy to PRODUCTION
#
# Branch keys below are case-sensitive: `main` matches a push to main and does NOT
# match a push to `Main`. A push to `Main` matches no branch pipeline and therefore
# deploys nothing at all — delete that branch (see notes at the end of this file).
#
# Steps run in order and a failed step stops the pipeline, so no deploy step can
# ever run unless the test gate ahead of it passed on that exact commit.
#
# NOTE: the pull-requests pipeline only *reports* — Bitbucket still allows the
# merge unless "Require passing builds before merge" is enabled in
# Repository settings -> Branch restrictions for both `main` and `prod`.
#
# Nothing is built in CI for deployment: the deploy steps only SSH to the Ubuntu
# host, which runs `docker compose up -d --build` itself.

definitions:
  steps:
    # ------------------------------------------------------------------
    # Guard: production only accepts changes that already went through TEST
    # ------------------------------------------------------------------
    - step: &guard
        name: Promotion guard
        image: alpine:3.22
        clone:
          depth: full # needs history to prove the commit is on main
        script:
          - apk add --no-cache git
          - |
            set -e
            DEST="${BITBUCKET_PR_DESTINATION_BRANCH:-}"
            if [ "$DEST" != "prod" ]; then
              echo "PR destination is '${DEST:-<none>}' — production guard not applicable."
              exit 0
            fi

            echo "PR targets prod — verifying this change already went through the test environment."

            if [ "$BITBUCKET_BRANCH" != "main" ]; then
              echo "BLOCKED: prod only accepts PRs from 'main'; this PR is from '$BITBUCKET_BRANCH'."
              echo "Merge into main first so the change deploys to TEST, then open main -> prod."
              exit 1
            fi

            git fetch -q origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$BITBUCKET_COMMIT" origin/main; then
              echo "BLOCKED: commit $BITBUCKET_COMMIT is not contained in origin/main,"
              echo "so it was never deployed to the test environment."
              exit 1
            fi

            echo "OK: $BITBUCKET_COMMIT is on main and has been through TEST."

    # ------------------------------------------------------------------
    # Test gate: everything runnable without a deployed environment
    # ------------------------------------------------------------------
    - step: &test
        name: Test gate
        image: node:22 # Node 20 is EOL (April 2026) — do not run CI on it
        caches:
          - node
        script:
          # npm ci, not npm install — honours package-lock.json so CI resolves the
          # exact tree that was tested locally.
          - npm ci

          # Linting is deliberately NOT part of this gate. `eslint .` currently
          # reports 36 pre-existing errors (20 regex escapes, 6 unused
          # identifiers, 7 react-hooks/set-state-in-effect, 3 react-refresh),
          # none of which are runtime defects. Run `npm run lint` locally when
          # you want to work through them; it must not block deployments.

          - |
            echo "--- production build ---"
            # A Vite build failure is the real signal here: it type-resolves every
            # import and fails on any broken module across all of src/.
            export VITE_BACKEND_URL="${VITE_BACKEND_URL:-https://vpay.goalluvium.net/}"
            npm run build
            test -f dist/index.html || { echo "build produced no dist/index.html"; exit 1; }
            echo "build output:"
            ls -la dist

          - |
            echo "--- unit tests ---"
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test ? 0 : 1)"; then
              # CI=true is already set by Bitbucket, so vitest runs once instead of watching.
              npm test
            else
              echo "WARNING: no \"test\" script in package.json — this repo has no test suite"
              echo "yet, so the unit-test portion of this gate asserted nothing."
              echo "Add vitest + a \"test\" script and it will run here automatically."
            fi

    # ------------------------------------------------------------------
    # Deploy: Zero-SSH via AWS Systems Manager (SSM) Run Command + OIDC
    #
    # Security Architecture:
    # 1. Zero Inbound Ports: Port 22 remains 100% closed on the EC2 host.
    #    Traffic communicates via outbound HTTPS (443) through the SSM agent.
    # 2. Zero Static Credentials: Uses Bitbucket OIDC web identity token
    #    (oidc: true) to assume the AWS IAM deployment role.
    # 3. Execution: SSM executes the deployment commands as the `ubuntu`
    #    user on the target EC2 instance.
    # ------------------------------------------------------------------
    - step: &deploy
        name: Deploy via AWS Systems Manager (Zero-SSH)
        image: amazon/aws-cli:latest
        oidc: true
        clone:
          enabled: false
        script:
          - export AWS_REGION="${AWS_REGION:-us-east-1}"
          - export AWS_ROLE_ARN="${AWS_ROLE_ARN:-arn:aws:iam::863859422390:role/bitbucket-pipelines-ec2-deployer}"
          - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/web-identity-token"
          - echo "$BITBUCKET_STEP_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
          - |
            set -e
            echo "================================================================="
            echo " Zero-SSH EC2 Frontend Deployment via AWS Systems Manager (SSM)"
            echo "================================================================="
            echo "Environment: ${BITBUCKET_DEPLOYMENT_ENVIRONMENT:-test}"
            echo "Branch:      $BITBUCKET_BRANCH"
            echo "Commit:      $BITBUCKET_COMMIT"
            echo "AWS Region:  $AWS_REGION"
            echo "IAM Role:    $AWS_ROLE_ARN"

            # 0. Authenticate & Verify AWS Identity via OIDC
            echo "Authenticating to AWS via OIDC Web Identity..."
            aws sts get-caller-identity

            # 1. Resolve Target EC2 Instance based on Deployment Environment
            if [ -n "${TARGET_INSTANCE_ID:-}" ]; then
              INSTANCE_ID="$TARGET_INSTANCE_ID"
              echo "Using explicitly configured Target Instance ID: $INSTANCE_ID"
            elif [ "${BITBUCKET_DEPLOYMENT_ENVIRONMENT:-test}" = "production" ]; then
              TARGET_TAG="${TARGET_APP_TAG:-vendor - prod}"
              echo "Production Environment: resolving EC2 instance with tag 'Original Name=$TARGET_TAG' in $AWS_REGION..."
              INSTANCE_ID=$(aws ec2 describe-instances \
                --region "$AWS_REGION" \
                --filters "Name=tag:Original Name,Values=$TARGET_TAG" "Name=instance-state-name,Values=running" \
                --query "Reservations[0].Instances[0].InstanceId" \
                --output text)
            else
              TARGET_TAG="${TARGET_APP_TAG:-TenderFlow_VendorPay}"
              echo "Test Environment: resolving EC2 instance with tag 'Original Name=$TARGET_TAG' in $AWS_REGION..."
              INSTANCE_ID=$(aws ec2 describe-instances \
                --region "$AWS_REGION" \
                --filters "Name=tag:Original Name,Values=$TARGET_TAG" "Name=instance-state-name,Values=running" \
                --query "Reservations[0].Instances[0].InstanceId" \
                --output text)
            fi

            if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
              echo "ERROR: Target EC2 instance not found or not running in $AWS_REGION for environment '${BITBUCKET_DEPLOYMENT_ENVIRONMENT:-test}'!"
              exit 1
            fi
            echo "Target EC2 Instance resolved: $INSTANCE_ID ($TARGET_TAG)"

            # 2. Check SSM Agent Connectivity
            echo "Verifying SSM Agent status on $INSTANCE_ID..."
            PING=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Offline")
            echo "SSM Agent Status: $PING"
            if [ "$PING" != "Online" ]; then
              echo "ERROR: Instance $INSTANCE_ID is $PING in Systems Manager (must be Online)."
              exit 1
            fi

            # 3. Configure Deployment Path & Backend URL
            export APP_PATH="${DEPLOY_PATH:-/home/ubuntu/merged-vp}"
            export BRANCH="${BITBUCKET_BRANCH:-main}"

            if [ -z "${VITE_BACKEND_URL:-}" ]; then
              if [ "${BITBUCKET_DEPLOYMENT_ENVIRONMENT:-test}" = "production" ]; then
                export VITE_BACKEND_URL="https://vpay.goalluvium.net/"
              else
                export VITE_BACKEND_URL="https://vpay.goalluvium.net/"
              fi
            fi

            echo "Deployment parameters:"
            echo "  App Path:    $APP_PATH"
            echo "  Branch:      $BRANCH"
            echo "  Backend URL: $VITE_BACKEND_URL"

            # 4. Construct SSM Run Command payload
            python3 -c 'import os, json; app = os.environ.get("APP_PATH", "/home/ubuntu/merged-vp"); branch = os.environ.get("BRANCH", "main"); backend_url = os.environ.get("VITE_BACKEND_URL", "https://vpay.goalluvium.net/"); params = {"commands": ["set -e", "echo === Deploying Frontend on $(hostname) at $(date) ===", f"sudo -u ubuntu -i bash -c \"cd '\''{app}'\'' && git fetch --all --prune && git checkout '\''{branch}'\'' && git reset --hard '\''origin/{branch}'\'' && export VITE_BACKEND_URL='\''{backend_url}'\'' && docker compose up -d --build && docker image prune -f\"", "echo === Docker Container Status ===", "sudo -u ubuntu -i docker ps --filter name=vendorpay-frontend", "echo === Deployment Finished Successfully ==="], "workingDirectory": [app]}; open("/tmp/ssm-parameters.json", "w").write(json.dumps(params, indent=2))'

            echo "Dispatching deployment commands to $INSTANCE_ID..."
            COMMAND_ID=$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "file:///tmp/ssm-parameters.json" \
              --comment "Bitbucket Frontend Deploy #${BITBUCKET_BUILD_NUMBER:-0} (${BITBUCKET_COMMIT})" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command dispatched. CommandId: $COMMAND_ID"
            echo "Streaming deployment execution on remote EC2 host..."

            # 5. Poll until completion
            STATUS="Pending"
            while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; do
              sleep 4
              STATUS=$(aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")
              echo "Status: $STATUS..."
            done

            echo "================================================================="
            echo " REMOTE HOST DEPLOYMENT OUTPUT"
            echo "================================================================="
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text

            if [ "$STATUS" != "Success" ]; then
              echo "=================================================================" >&2
              echo " REMOTE HOST DEPLOYMENT ERROR" >&2
              echo "=================================================================" >&2
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text >&2
              echo "ERROR: Deployment failed with status: $STATUS" >&2
              exit 1
            fi

            echo "================================================================="
            echo " Frontend deployment to $BITBUCKET_DEPLOYMENT_ENVIRONMENT succeeded! ✅"
            echo "================================================================="

pipelines:
  pull-requests:
    prod:
      - step: *test

    "**":
      - step: *guard
      - step: *test

  branches:
    main:
      - step: *test
      - step:
          <<: *deploy
          name: Deploy to Test environment (Zero-SSH)
          deployment: test

    prod:
      - step: *test
      - step:
          <<: *deploy
          name: Deploy to Production (Zero-SSH)
          deployment: production

    feature/zero-ssh-ssm-pipeline:
      - step: *test
      - step:
          <<: *deploy
          name: Deploy to Test environment (Zero-SSH Verification)
          deployment: test

  custom:
    deploy-test-manual:
      - step: *test
      - step:
          <<: *deploy
          name: Manual Deploy to Test environment (Zero-SSH)
          deployment: test

# ----------------------------------------------------------------------
# Repo housekeeping this file depends on:
#
#  1. Branch keys here are CASE-SENSITIVE: `main` does not match a push to
#     `Main`. The stray `Main` branch this repo used to carry has been deleted,
#     so the remote now holds only `main` and `prod` — keep it that way. A local
#     clone may still have a stale `origin/HEAD -> origin/Main` symref; fix it
#     with:
#       git remote set-head origin -a
#
#  2. Enable in Repository settings -> Branch restrictions, for `main` and `prod`:
#       - Require passing builds before merge (minimum 1)
#       - Prevent direct pushes (forces changes through a PR)
#     Without these, Bitbucket still allows merging a red build. The step
#     ordering above is what guarantees a failed gate blocks the deploy.
#
#  3. The `test` and `production` deployment environments must define distinct
#     SSH_HOST / DEPLOY_PATH / VITE_BACKEND_URL values.
#
#  4. Both deployment environments must also define SSH_PRIVATE_KEY_B64 (masked)
#     and KNOWN_HOSTS_B64. These are deployment-scoped, so they are only visible
#     to steps declaring `deployment:`. Clear the key under Repository settings
#     -> Pipelines -> SSH keys, or it will collide with the one written here.
#
#  5. THE `prod` BRANCH MUST CARRY THIS SAME FILE.
#     Bitbucket always reads bitbucket-pipelines.yml from the branch being built,
#     and for a pull request that means the PR's SOURCE branch. So:
#
#       - a `prod -> main` PR is governed by PROD's copy of this file;
#       - a push/merge to `prod` is governed by PROD's copy;
#       - only pushes and PRs originating from `main` are governed by this copy.
#
#     If prod's copy has no `pull-requests` section, a `prod -> main` PR runs
#     nothing at all — no gate, no report, no failure. That is not a
#     misconfiguration you can fix from this branch; prod's copy has to be
#     updated. Whenever this file changes on main, promote it to prod.
# ----------------------------------------------------------------------
