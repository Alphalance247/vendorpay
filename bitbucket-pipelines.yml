image: atlassian/default-image:4

definitions:
  steps:
    - step: &deploy
        name: Deploy over SSH
        clone:
          enabled: false          # nothing is built here — deployment happens on the server
        script:
          # --- set up the SSH key from the base64 secured variable ---
          - mkdir -p ~/.ssh
          - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # --- pull the branch on the server and rebuild the stack ---
          - >
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST"
            "set -e &&
            cd '$DEPLOY_PATH' &&
            git fetch --all --prune &&
            git checkout $BITBUCKET_BRANCH &&
            git reset --hard origin/$BITBUCKET_BRANCH &&
            export VITE_BACKEND_URL='$VITE_BACKEND_URL' &&
            docker compose up -d --build &&
            docker image prune -f"

pipelines:
  branches:
    main:
      - step:
          <<: *deploy
          name: Deploy to Development
          deployment: test
    prod:
      - step:
          <<: *deploy
          name: Deploy to Production
          deployment: production
